name: check
# Text lint + tests on every push and pull request. Tests that need the game ROM skip themselves.
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -X utf8 tools/check.py
